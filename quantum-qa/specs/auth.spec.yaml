name: "Authentication Flow"
description: "Login, logout, token refresh — Web, Mobile"
requirement_ids: [REQ-010, REQ-011]

skills:
  - name: auth_flow
    platforms: [web, mobile]
    description: "Verify login and logout work correctly"
    steps:
      - navigate: "/login"
      - fill: email    → "test@example.com"
      - fill: password → "Test@1234"
      - click: login_button
      - assert: "dashboard_visible"
      - click: logout_button
      - assert: "login_page_visible"

  - name: accessibility_check
    platforms: [web, mobile]
    description: "Verify WCAG 2.1 AA accessibility on auth pages"
    steps:
      - navigate: "/login"
      - assert: "all_inputs_have_labels"
      - assert: "color_contrast_ratio >= 4.5"
      - assert: "keyboard_navigation_works"

requirements_tracing:
  REQ-010: "User can log in with valid credentials"
  REQ-011: "Auth pages meet accessibility standards"
